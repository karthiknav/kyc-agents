AWSTemplateFormatVersion: '2010-09-09'
Description: 'KYC Main Stack - SQS queue'


Parameters:
  DefaultModelId:
    Type: String
    Description: Default model id written to SSM Parameter Store at /kyc-agent/model-id
    Default: us.anthropic.claude-3-5-sonnet-20241022-v2:0

  LangfuseProjectName:
    Type: String
    Description: Langfuse project name written to SSM at /langfuse/project_name
    Default: ""

  LangfuseHost:
    Type: String
    Description: Langfuse host URL written to SSM at /langfuse/host
    Default: ""

  LangfusePublicKey:
    Type: String
    Description: Langfuse public key written to SSM at /langfuse/public_key (set to your actual key after stack creation)
    Default: ""
    NoEcho: true

  LangfuseSecretKey:
    Type: String
    Description: Langfuse secret key written to SSM at /langfuse/secret_key (set to your actual key after stack creation)
    Default: ""
    NoEcho: true


Conditions:
  HasLangfuseProjectName: !Not [!Equals [!Ref LangfuseProjectName, ""]]
  HasLangfuseHost: !Not [!Equals [!Ref LangfuseHost, ""]]
  HasLangfusePublicKey: !Not [!Equals [!Ref LangfusePublicKey, ""]]
  HasLangfuseSecretKey: !Not [!Equals [!Ref LangfuseSecretKey, ""]]


Resources:
  # SQS queue - middleware/FastAPI publishes here when KYC is initiated
  KycInitiatedQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${AWS::StackName}-kyc-initiated"
      VisibilityTimeout: 1200
      MessageRetentionPeriod: 345600
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-kyc-initiated"

  KycAgentModelIdParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /kyc-agent/model-id
      Type: String
      Value: !Ref DefaultModelId
      Description: Default model id for the KYC agent (read as env MODEL)

  LangfuseProjectNameParameter:
    Type: AWS::SSM::Parameter
    Condition: HasLangfuseProjectName
    Properties:
      Name: /langfuse/project_name
      Type: String
      Value: !Ref LangfuseProjectName
      Description: Langfuse project name (read by relaunch_agent_runtime_langfuse.py)

  LangfuseHostParameter:
    Type: AWS::SSM::Parameter
    Condition: HasLangfuseHost
    Properties:
      Name: /langfuse/host
      Type: String
      Value: !Ref LangfuseHost
      Description: Langfuse host URL (read by relaunch_agent_runtime_langfuse.py)

  LangfusePublicKeyParameter:
    Type: AWS::SSM::Parameter
    Condition: HasLangfusePublicKey
    Properties:
      Name: /langfuse/public_key
      Type: String
      Value: !Ref LangfusePublicKey
      Description: Langfuse public key — update via SSM console or aws ssm put-parameter after stack creation

  LangfuseSecretKeyParameter:
    Type: AWS::SSM::Parameter
    Condition: HasLangfuseSecretKey
    Properties:
      Name: /langfuse/secret_key
      Type: String
      Value: !Ref LangfuseSecretKey
      Description: Langfuse secret key — update via SSM console or aws ssm put-parameter after stack creation

Outputs:
  KycAgentModelIdParameterName:
    Description: SSM parameter name that stores the model id
    Value: /kyc-agent/model-id

  KycInitiatedQueueName:
    Description: Name of the SQS queue for KYC-initiated events
    Value: !Sub "${AWS::StackName}-kyc-initiated"
    Export:
      Name: !Sub "${AWS::StackName}-KycInitiatedQueueName"

  KycInitiatedQueueUrl:
    Description: SQS queue URL for middleware/FastAPI to publish when KYC is initiated
    Value: !Ref KycInitiatedQueue
    Export:
      Name: !Sub "${AWS::StackName}-KycInitiatedQueueUrl"

  KycInitiatedQueueArn:
    Description: ARN of the KYC initiated SQS queue
    Value: !GetAtt KycInitiatedQueue.Arn
    Export:
      Name: !Sub "${AWS::StackName}-KycInitiatedQueueArn"
