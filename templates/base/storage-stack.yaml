# storage-stack.yaml (fixed)
AWSTemplateFormatVersion: '2010-09-09'
Description: 'Storage Stack - S3 bucket and DynamoDB KYC cases table'

Parameters:
  StackName:
    Type: String
    Description: Base name for the stack

Resources:
  SourceBucket:
    Type: AWS::S3::Bucket
    Properties:
      # Globally unique, deterministic bucket name
      BucketName: !Sub "${StackName}-${AWS::AccountId}-${AWS::Region}"

  ArtifactsBucket:
    Type: AWS::S3::Bucket
    Properties:
      # Bucket for storing artifacts from different services
      BucketName: !Sub "${StackName}-artifacts-${AWS::AccountId}-${AWS::Region}"

  KycCasesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      # Reduce risk of collisions within your account/region across environments
      TableName: !Sub "${StackName}-kyc-cases-${AWS::AccountId}-${AWS::Region}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: CaseId
          AttributeType: S
      KeySchema:
        - AttributeName: CaseId
          KeyType: HASH
      Tags:
        - Key: Name
          Value: !Sub "${StackName}-kyc-cases"

Outputs:
  SourceBucketName:
    Description: Name of the source bucket
    Value: !Ref SourceBucket
    Export:
      Name: !Sub "${StackName}-SourceBucketName"

  ArtifactsBucketName:
    Description: Name of the artifacts bucket for service artifacts
    Value: !Ref ArtifactsBucket
    Export:
      Name: !Sub "${StackName}-ArtifactsBucketName"

  KycCasesTableName:
    Description: DynamoDB table name for KYC cases (CaseId primary key)
    Value: !Ref KycCasesTable
    Export:
      Name: !Sub "${StackName}-KycCasesTableName"

  KycCasesTableArn:
    Description: ARN of the KYC cases DynamoDB table
    Value: !GetAtt KycCasesTable.Arn
    Export:
      Name: !Sub "${StackName}-KycCasesTableArn"