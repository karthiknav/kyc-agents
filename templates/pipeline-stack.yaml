AWSTemplateFormatVersion: '2010-09-09'
Description: 'CI/CD Pipeline — GitHub → CodeBuild → AgentCore Runtime'

Parameters:
  GitHubConnectionArn:
    Type: String
    Description: ARN of the AWS CodeConnections connection to GitHub

  GitHubRepo:
    Type: String
    Description: GitHub repository in owner/repo format (e.g. myorg/kyc-agents)

  GitHubBranch:
    Type: String
    Default: main
    Description: Branch to track for deployments

  RolesStackName:
    Type: String
    Description: Name of the roles stack to import IAM roles from

  AgentcoreStackName:
    Type: String
    Description: Name to give the agentcore CloudFormation stack that the pipeline deploys

  AgentName:
    Type: String
    Default: runtime
    Description: Logical agent name passed through to agentcore-stack

  KycCasesTableName:
    Type: String
    Description: DynamoDB table name for KYC cases

  KycResultsBucketName:
    Type: String
    Description: S3 bucket name for KYC results/reports

  MockServiceUrl:
    Type: String
    Default: ''
    Description: Base URL of the mock-service (empty = tools fall back to localhost)

  RiskScorerEndpointName:
    Type: String
    Default: ''
    Description: SageMaker endpoint name for the ML risk scorer, passed through to agentcore-stack (empty = falls back to the heuristic scorer)

  VpcStackName:
    Type: String
    Description: Name of the VPC stack to import networking resources from (passed to agentcore-stack)

  LangfuseEnabled:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Set to true to apply Langfuse/OTEL env to the agent runtime after deploy

  LangfuseSsmPrefix:
    Type: String
    Default: '/langfuse'
    Description: SSM parameter path prefix for Langfuse credentials

Resources:

  # ── ECR ──────────────────────────────────────────────────────────────────────
  ECRRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub "${AWS::StackName}-agent"
      EmptyOnDelete: true
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [{
              "rulePriority": 1,
              "description": "Keep last 5 images",
              "selection": {
                "tagStatus": "any",
                "countType": "imageCountMoreThan",
                "countNumber": 5
              },
              "action": { "type": "expire" }
            }]
          }

  # ── S3 artifact bucket ───────────────────────────────────────────────────────
  PipelineArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AWS::StackName}-artifacts-${AWS::AccountId}"
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldArtifacts
            Status: Enabled
            ExpirationInDays: 30

  # ── CodeBuild — builds the crew/ Docker image ─────────────────────────────
  AgentImageBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub "${AWS::StackName}-agent-build"
      Description: Build KYC agent Docker image and push to ECR
      ServiceRole: !ImportValue
        Fn::Sub: "${RolesStackName}-CodeBuildRoleArn"
      Artifacts:
        Type: CODEPIPELINE
      Cache:
        Type: LOCAL
        Modes:
          - LOCAL_DOCKER_LAYER_CACHE
      Environment:
        Type: ARM_CONTAINER
        ComputeType: BUILD_GENERAL1_LARGE
        Image: aws/codebuild/amazonlinux2-aarch64-standard:3.0
        PrivilegedMode: true
        EnvironmentVariables:
          - Name: AWS_ACCOUNT_ID
            Value: !Ref AWS::AccountId
          - Name: AWS_DEFAULT_REGION
            Value: !Ref AWS::Region
          - Name: IMAGE_REPO_NAME
            Value: !Ref ECRRepository
      Source:
        Type: CODEPIPELINE
        BuildSpec: |
          version: 0.2
          env:
            exported-variables:
              - IMAGE_TAG
              - ECR_REPO_URI
          phases:
            pre_build:
              commands:
                - IMAGE_TAG=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c1-8)
                - ECR_REPO_URI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$IMAGE_REPO_NAME
                - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $ECR_REPO_URI
            build:
              commands:
                - docker build -t $ECR_REPO_URI:$IMAGE_TAG -t $ECR_REPO_URI:latest -f crew/Dockerfile .
            post_build:
              commands:
                - docker push $ECR_REPO_URI:$IMAGE_TAG
                - docker push $ECR_REPO_URI:latest
                - printf '{"ImageTag":"%s","ECRRepositoryUri":"%s"}' $IMAGE_TAG $ECR_REPO_URI > parameters.json
          artifacts:
            files:
              - parameters.json
              - templates/**
            discard-paths: no

  # ── CodeBuild — applies Langfuse/OTEL env to the agent runtime ───────────────
  LangfuseRelaunchProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub "${AWS::StackName}-langfuse-relaunch"
      Description: Apply Langfuse/OTEL env vars to AgentCore runtime via UpdateAgentRuntime
      ServiceRole: !ImportValue
        Fn::Sub: "${RolesStackName}-CodeBuildRoleArn"
      Artifacts:
        Type: CODEPIPELINE
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0
        EnvironmentVariables:
          - Name: LANGFUSE_ENABLED
            Value: !Ref LangfuseEnabled
          - Name: AGENTCORE_STACK_NAME
            Value: !Ref AgentcoreStackName
          - Name: LANGFUSE_SSM_PREFIX
            Value: !Ref LangfuseSsmPrefix
          - Name: AWS_DEFAULT_REGION
            Value: !Ref AWS::Region
      Source:
        Type: CODEPIPELINE
        BuildSpec: buildspec-langfuse.yml

  GenerateAgentNetworkProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub "${AWS::StackName}-generate-agent-network"
      Description: Generate agent network JSON by indexing crew/ and querying via Bedrock
      ServiceRole: !ImportValue
        Fn::Sub: "${RolesStackName}-CodeBuildRoleArn"
      Artifacts:
        Type: CODEPIPELINE
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0
        EnvironmentVariables:
          - Name: AWS_DEFAULT_REGION
            Value: !Ref AWS::Region
          - Name: AWS_REGION
            Value: !Ref AWS::Region
          - Name: PYTHONUNBUFFERED
            Value: "1"
          - Name: AGENT_NETWORK_PUBLISH_BUCKET
            Value: !Ref PipelineArtifactBucket
          - Name: AGENT_NETWORK_PUBLISH_PREFIX
            Value: "published/agent-network"
      Source:
        Type: CODEPIPELINE
        BuildSpec: |
          version: 0.2
          phases:
            install:
              runtime-versions:
                python: 3.11
              commands:
                - python -m pip install --upgrade pip
            build:
              commands:
                - cd scripts/agent-network-gen
                - python -m pip install -r requirements.txt
                - python generate_agent_network.py --input-dir crew --output-file agent-network.json
                - test -f agent-network.json
                - aws s3 cp agent-network.json "s3://$AGENT_NETWORK_PUBLISH_BUCKET/$AGENT_NETWORK_PUBLISH_PREFIX/latest.json" --region "$AWS_DEFAULT_REGION"
                - cd ../..
          artifacts:
            files:
              - scripts/agent-network-gen/agent-network.json
            discard-paths: no

  # ── CodePipeline ─────────────────────────────────────────────────────────────
  AgentPipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: !Sub "${AWS::StackName}-pipeline"
      RoleArn: !ImportValue
        Fn::Sub: "${RolesStackName}-CodePipelineRoleArn"
      PipelineType: V2
      ArtifactStore:
        Type: S3
        Location: !Ref PipelineArtifactBucket
      Triggers:
        - ProviderType: CodeStarSourceConnection
          GitConfiguration:
            SourceActionName: GitHubSource
            Push:
              - Branches:
                  Includes:
                    - !Ref GitHubBranch
                FilePaths:
                  Includes:
                    - crew/**
                    - templates/agentcore-stack.yaml
                    - templates/pipeline-stack.yaml
      Stages:

        # Stage 1: pull source from GitHub on every push to the tracked branch
        - Name: Source
          Actions:
            - Name: GitHubSource
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeStarSourceConnection
                Version: "1"
              Configuration:
                ConnectionArn: !Ref GitHubConnectionArn
                FullRepositoryId: !Ref GitHubRepo
                BranchName: !Ref GitHubBranch
                OutputArtifactFormat: CODE_ZIP
                DetectChanges: false
              OutputArtifacts:
                - Name: SourceArtifact
              RunOrder: 1

        # Stage 2: build Docker image, push to ECR, emit parameters.json
        - Name: Build
          Actions:
            - Name: BuildDockerImage
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: "1"
              Configuration:
                ProjectName: !Ref AgentImageBuildProject
              InputArtifacts:
                - Name: SourceArtifact
              OutputArtifacts:
                - Name: BuildArtifact
              RunOrder: 1

        # Stage 3: deploy (or update) the agentcore stack with the new image
        - Name: Deploy
          Actions:
            - Name: DeployAgentcoreStack
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: CloudFormation
                Version: "1"
              Configuration:
                ActionMode: CREATE_UPDATE
                StackName: !Ref AgentcoreStackName
                # Template comes from the source artifact so IaC stays in sync with code
                TemplatePath: "SourceArtifact::templates/agentcore-stack.yaml"
                Capabilities: CAPABILITY_IAM,CAPABILITY_NAMED_IAM,CAPABILITY_AUTO_EXPAND
                RoleArn: !ImportValue
                  Fn::Sub: "${RolesStackName}-CloudFormationDeployRoleArn"
                # Static params are substituted here; dynamic params read from parameters.json
                ParameterOverrides: !Sub |
                  {
                    "RolesStackName":       "${RolesStackName}",
                    "AgentName":            "${AgentName}",
                    "KycCasesTableName":    "${KycCasesTableName}",
                    "KycResultsBucketName": "${KycResultsBucketName}",
                    "MockServiceUrl":       "${MockServiceUrl}",
                    "RiskScorerEndpointName": "${RiskScorerEndpointName}",
                    "VpcStackName":         "${VpcStackName}",
                    "ImageTag":             {"Fn::GetParam": ["BuildArtifact", "parameters.json", "ImageTag"]},
                    "ECRRepositoryUri":     {"Fn::GetParam": ["BuildArtifact", "parameters.json", "ECRRepositoryUri"]}
                  }
              InputArtifacts:
                - Name: SourceArtifact
                - Name: BuildArtifact
              RunOrder: 1

        # Stage 4: apply Langfuse/OTEL env to the running runtime (no-op when LangfuseEnabled=false)
        - Name: RelaunchLangfuse
          Actions:
            - Name: ApplyLangfuseEnv
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: "1"
              Configuration:
                ProjectName: !Ref LangfuseRelaunchProject
              InputArtifacts:
                - Name: SourceArtifact
              RunOrder: 1

        # Stage 5: generate agent network JSON for the frontend
        - Name: GenerateAgentNetwork
          Actions:
            - Name: GenerateAgentNetwork
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: "1"
              Configuration:
                ProjectName: !Ref GenerateAgentNetworkProject
              InputArtifacts:
                - Name: SourceArtifact
              OutputArtifacts:
                - Name: AgentNetworkArtifact
              RunOrder: 1

Outputs:
  ECRRepositoryUri:
    Description: ECR repository URI for the agent image
    Value: !GetAtt ECRRepository.RepositoryUri
    Export:
      Name: !Sub "${AWS::StackName}-ECRRepositoryUri"

  PipelineArtifactBucketName:
    Description: S3 bucket name used for pipeline artifacts (also stores published agent-network JSON)
    Value: !Ref PipelineArtifactBucket
    Export:
      Name: !Sub "${AWS::StackName}-PipelineArtifactBucketName"

  AgentNetworkLatestBucketName:
    Description: S3 bucket containing the published agent-network latest JSON
    Value: !Ref PipelineArtifactBucket
    Export:
      Name: !Sub "${AWS::StackName}-AgentNetworkLatestBucketName"

  AgentNetworkLatestObjectKey:
    Description: S3 object key for the published agent-network latest JSON
    Value: "published/agent-network/latest.json"
    Export:
      Name: !Sub "${AWS::StackName}-AgentNetworkLatestObjectKey"

  PipelineName:
    Description: Name of the CodePipeline
    Value: !Ref AgentPipeline
    Export:
      Name: !Sub "${AWS::StackName}-PipelineName"

  BuildProjectName:
    Description: CodeBuild project name
    Value: !Ref AgentImageBuildProject
    Export:
      Name: !Sub "${AWS::StackName}-BuildProjectName"
