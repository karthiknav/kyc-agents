AWSTemplateFormatVersion: '2010-09-09'
Description: 'KYC Lambda Stack — SQS-triggered Lambda that invokes the KYC AgentCore runtime'

Parameters:
  AgentArn:
    Type: String
    Description: ARN of the Bedrock AgentCore runtime for the KYC agent

  KycCasesTableName:
    Type: String
    Description: DynamoDB table name for KYC cases

  KycLambdaExecutionRoleArn:
    Type: String
    Description: ARN of the IAM role for the KYC processor Lambda

  LambdaSourceBucket:
    Type: String
    Description: S3 bucket containing the Lambda deployment package

  LambdaSourceKey:
    Type: String
    Description: S3 key for the Lambda zip file

  KycLambdaTimeout:
    Type: Number
    Default: 60
    Description: Lambda timeout in seconds
    MinValue: 10
    MaxValue: 900

  KycInitiatedQueueArn:
    Type: String
    Description: ARN of the SQS queue for KYC-initiated events

Resources:
  KycProcessorFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-kyc-processor"
      Runtime: python3.11
      Handler: kyc-processor.handler
      Role: !Ref KycLambdaExecutionRoleArn
      Timeout: !Ref KycLambdaTimeout
      Environment:
        Variables:
          KYC_AGENT_ARN: !Ref AgentArn
          KYC_CASES_TABLE: !Ref KycCasesTableName
      Code:
        S3Bucket: !Ref LambdaSourceBucket
        S3Key: !Ref LambdaSourceKey

  KycProcessorEventSourceMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !Ref KycInitiatedQueueArn
      FunctionName: !Ref KycProcessorFunction
      BatchSize: 10

Outputs:
  KycProcessorFunctionArn:
    Description: ARN of the KYC processor Lambda
    Value: !GetAtt KycProcessorFunction.Arn
    Export:
      Name: !Sub "${AWS::StackName}-KycProcessorFunctionArn"
