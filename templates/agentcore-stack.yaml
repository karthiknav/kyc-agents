AWSTemplateFormatVersion: '2010-09-09'
Description: 'Agent Core Runtime — deployed by the CI/CD pipeline'

# This stack is managed by pipeline-stack.yaml. Do not deploy it manually after
# the pipeline is set up; the pipeline passes ImageTag and ECRRepositoryUri from
# the build stage.

Parameters:
  ImageTag:
    Type: String
    Description: Docker image tag to deploy (git commit SHA short, set by pipeline)

  ECRRepositoryUri:
    Type: String
    Description: Full ECR repository URI (set by pipeline from pipeline-stack outputs)

  AgentName:
    Type: String
    Default: runtime
    Description: Logical name for the agent runtime

  RolesStackName:
    Type: String
    Description: Name of the roles stack to import IAM roles from

  VpcStackName:
    Type: String
    Description: Name of the VPC stack to import networking resources from

  KycCasesTableName:
    Type: String
    Description: DynamoDB table name for KYC cases (passed to agent as KYC_CASES_TABLE)

  KycResultsBucketName:
    Type: String
    Description: S3 bucket name for KYC results/reports (passed to agent as KYC_RESULTS_BUCKET)

  MockServiceUrl:
    Type: String
    Default: ''
    Description: Base URL of the mock-service (empty = tools fall back to localhost)

Resources:

  AgentCoreSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: AgentCore runtime egress only
      VpcId: !ImportValue
        Fn::Sub: "${VpcStackName}-VpcId"
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-agentcore-sg"

  AgentRuntime:
    Type: AWS::BedrockAgentCore::Runtime
    Properties:
      AgentRuntimeName: !Sub
        - "${StackNameUnderscore}_${AgentName}"
        - StackNameUnderscore: !Join ["_", !Split ["-", !Ref "AWS::StackName"]]
      AgentRuntimeArtifact:
        ContainerConfiguration:
          ContainerUri: !Sub "${ECRRepositoryUri}:${ImageTag}"
      EnvironmentVariables:
        KYC_CASES_TABLE: !Ref KycCasesTableName
        KYC_RESULTS_BUCKET: !Ref KycResultsBucketName
        MOCK_SERVICE_URL: !Ref MockServiceUrl
        # Changing ImageTag forces AgentCore to redeploy with the new container
        DEPLOYED_IMAGE_TAG: !Ref ImageTag
        CREWAI_DISABLE_TELEMETRY: "true"
        OTEL_PYTHON_EXCLUDED_URLS: "https://api.scarf.sh/"
        USE_TEXTRACT_MOCK: "1"
      RoleArn: !ImportValue
        Fn::Sub: "${RolesStackName}-AgentExecutionRoleArn"
      NetworkConfiguration:
        NetworkMode: VPC
        NetworkModeConfig:
          Subnets:
            - !ImportValue
                Fn::Sub: "${VpcStackName}-PrivateSubnet1Id"
            - !ImportValue
                Fn::Sub: "${VpcStackName}-PrivateSubnet2Id"
          SecurityGroups:
            - !Ref AgentCoreSecurityGroup
      Description: !Sub "KYC agent runtime — image ${ImageTag}"

Outputs:
  AgentRuntimeArn:
    Description: ARN of the agent runtime
    Value: !GetAtt AgentRuntime.AgentRuntimeArn
    Export:
      Name: !Sub "${AWS::StackName}-AgentRuntimeArn"
