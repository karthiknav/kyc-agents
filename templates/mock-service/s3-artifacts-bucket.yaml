# Optional: create an S3 bucket for EB source bundles. Use this bucket name in elastic-beanstalk.yaml (S3Bucket parameter).
AWSTemplateFormatVersion: "2010-09-09"
Description: "S3 bucket for Elastic Beanstalk application source bundles (deploy.zip)."

Parameters:
  BucketName:
    Type: String
    Description: "Name of the S3 bucket (must be globally unique). Example: mycompany-kyc-mock-artifacts"

Resources:
  ArtifactsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref BucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

Outputs:
  BucketName:
    Description: S3 bucket for deploy.zip uploads
    Value: !Ref ArtifactsBucket
    Export:
      Name: !Sub "${AWS::StackName}-BucketName"
