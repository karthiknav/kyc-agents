AWSTemplateFormatVersion: '2010-09-09'
Description: >
  EC2 instance pre-loaded with Terraform 1.15.5 for running the Langfuse deployment.
  The instance role has AdministratorAccess so Terraform can create EKS, IAM, Route53,
  ACM, ALB, Fargate, and all other required resources on your behalf.
  Deploy with: aws cloudformation deploy --capabilities CAPABILITY_NAMED_IAM

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC to place the instance in (use your existing VPC).

  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Public subnet for the instance (needs internet access to download providers).

  AllowedSshCidr:
    Type: String
    Default: 0.0.0.0/0
    Description: CIDR allowed to SSH in. Restrict to your IP for security (e.g. 1.2.3.4/32).

  InstanceType:
    Type: String
    Default: t3.small
    AllowedValues: [t3.micro, t3.small, t3.medium]
    Description: Instance size — t3.small is sufficient for running Terraform.

Resources:

  # ── IAM role assumed by the EC2 instance ────────────────────────────────────
  TerraformRunnerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-terraform-runner-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        # AdministratorAccess lets Terraform create EKS, IAM roles, Route53, ACM,
        # ALB, Fargate profiles, S3, and everything else the Langfuse module needs.
        - arn:aws:iam::aws:policy/AdministratorAccess
      Tags:
        - Key: ManagedBy
          Value: CloudFormation

  TerraformRunnerInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub "${AWS::StackName}-terraform-runner-profile"
      Roles:
        - !Ref TerraformRunnerRole

  # ── Security group: SSH only ─────────────────────────────────────────────────
  TerraformRunnerSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: SSH access for Terraform runner
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref AllowedSshCidr
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-terraform-runner-sg"

  # ── EC2 instance ─────────────────────────────────────────────────────────────
  TerraformRunnerInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      SubnetId: !Ref SubnetId
      SecurityGroupIds:
        - !Ref TerraformRunnerSG
      IamInstanceProfile: !Ref TerraformRunnerInstanceProfile
      # Amazon Linux 2023 (x86_64) — update AMI if deploying to a different region
      ImageId: !Sub "{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}"
      UserData:
        Fn::Base64: |
          #!/bin/bash
          set -e
          yum update -y
          yum install -y unzip git

          # Install Terraform 1.15.5
          cd /tmp
          curl -sO https://releases.hashicorp.com/terraform/1.15.5/terraform_1.15.5_linux_amd64.zip
          unzip -o terraform_1.15.5_linux_amd64.zip
          mv terraform /usr/local/bin/terraform
          terraform version

          # Install kubectl (for post-deploy EKS operations)
          curl -sLO "https://dl.k8s.io/release/$(curl -sL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl

          # Install helm (for Helm dependency updates)
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

          # Configure AWS CLI region
          aws configure set region us-east-1
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-terraform-runner"

Outputs:
  InstanceId:
    Description: EC2 instance ID
    Value: !Ref TerraformRunnerInstance

  PublicIp:
    Description: Public IP — SSH with your key pair
    Value: !GetAtt TerraformRunnerInstance.PublicIp

  InstanceRoleArn:
    Description: ARN of the IAM role attached to the instance
    Value: !GetAtt TerraformRunnerRole.Arn

  InstanceConnectCommand:
    Description: Connect via EC2 Instance Connect (no key pair needed)
    Value: !Sub "aws ec2-instance-connect ssh --instance-id ${TerraformRunnerInstance} --os-user ec2-user"
