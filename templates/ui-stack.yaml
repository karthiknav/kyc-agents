AWSTemplateFormatVersion: '2010-09-09'
Description: 'KYC UI — S3 bucket for static files + CloudFront distribution'

Parameters:
  AcmCertificateArn:
    Type: String
    Default: ''
    Description: 'ARN of the ACM certificate for CloudFront (must be in us-east-1; optional — omit for default *.cloudfront.net cert)'
  CustomDomainName:
    Type: String
    Default: ''
    Description: 'Custom domain alias for CloudFront, e.g. kyc.gen-ai-designs.com (requires AcmCertificateArn)'

Conditions:
  UseAcmCert: !Not [!Equals [!Ref AcmCertificateArn, '']]
  UseCustomDomain: !Not [!Equals [!Ref CustomDomainName, '']]

Resources:
  StaticBucket:
    Type: AWS::S3::Bucket
    Properties:
      # Name derived from stack; must be lowercase for S3
      BucketName: !Sub "${AWS::StackName}-static-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ['*']
            AllowedMethods: [GET, HEAD]
            AllowedOrigins: ['*']
            MaxAge: 3600

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  StaticBucketPolicy:
    Type: AWS::S3::BucketPolicy
    DependsOn: Distribution
    Properties:
      Bucket: !Ref StaticBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontServicePrincipal
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${StaticBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  Distribution:
    Type: AWS::CloudFront::Distribution
    DependsOn: OriginAccessControl
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Aliases: !If
          - UseCustomDomain
          - [!Ref CustomDomainName]
          - !Ref AWS::NoValue
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt StaticBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ''
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
            - OPTIONS
          Compress: true
          DefaultTTL: 86400
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
        ViewerCertificate: !If
          - UseAcmCert
          - AcmCertificateArn: !Ref AcmCertificateArn
            MinimumProtocolVersion: TLSv1.2_2021
            SslSupportMethod: sni-only
          - CloudFrontDefaultCertificate: true
        PriceClass: PriceClass_100

Outputs:
  StaticBucketName:
    Description: S3 bucket for static UI assets (sync frontend build here)
    Value: !Ref StaticBucket
    Export:
      Name: !Sub "${AWS::StackName}-StaticBucketName"
  DistributionId:
    Description: CloudFront distribution ID (use for cache invalidation)
    Value: !Ref Distribution
    Export:
      Name: !Sub "${AWS::StackName}-DistributionId"
  DistributionDomainName:
    Description: CloudFront distribution domain name
    Value: !GetAtt Distribution.DomainName
    Export:
      Name: !Sub "${AWS::StackName}-DistributionDomainName"
  WebsiteUrl:
    Description: HTTPS URL of the KYC UI
    Value: !If
      - UseCustomDomain
      - !Sub "https://${CustomDomainName}"
      - !Sub "https://${Distribution.DomainName}"
    Export:
      Name: !Sub "${AWS::StackName}-WebsiteUrl"
