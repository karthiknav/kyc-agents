orchestrator_task:
  description: >
    Given caseId {caseId}, orchestrate the full KYC workflow:

    STEP 1 — Determine current state:
      Use get_case_details to fetch the case, then use get_case_stages to read the stages map.

    STEP 2 — Branch based on state:

      A) If stages.orchestrator does NOT exist (first invocation):
         Call fanout_subagents with the case_id to trigger document_processor and sanctions
         sub-agents in parallel. Return JSON: {{"case_id": ..., "action": "FANNED_OUT",
         "status": "AWAITING_SUBAGENTS"}}.

      B) If stages.orchestrator.status == "AWAITING_SUBAGENTS" and BOTH stages.documentProcessing
         AND stages.screening are present (sub-agents have completed):
         Call aggregate_kyc_results with case_id, the documentProcessing stage JSON, and the
         screening stage JSON to get the final decision.
         - If decision == "APPROVE": return JSON with action "APPROVED".
         - If decision == "ESCALATE": call escalate_to_human with case_id, reason, and
           escalation_summary from the aggregate result. Return JSON with action "ESCALATED".

      C) If stages.orchestrator.status == "AWAITING_SUBAGENTS" but one or both sub-agent
         stages are still missing (sub-agents still running):
         Return JSON: {{"case_id": ..., "action": "WAITING", "status": "AWAITING_SUBAGENTS",
         "missing": [...list of missing stages...]}}.

      D) If stages.orchestrator.status is already "ESCALATED" or case status is
         "PENDING_HUMAN_REVIEW": return JSON indicating case is already escalated.

  expected_output: >
    Valid JSON object with at minimum these keys:
    - "case_id": the case ID (string)
    - "action": one of "FANNED_OUT", "APPROVED", "ESCALATED", "WAITING", "ALREADY_ESCALATED"
    - "status": current orchestrator status string
    For APPROVE/ESCALATE actions also include:
    - "decision": "APPROVE" or "ESCALATE"
    - "reason": list of strings describing the decision factors
    - "recommendation_summary": explanation of the outcome
  agent: orchestrator_agent

document_processing_task:
  description: >
    Given caseId {caseId}:
    1. Use get_case_details to fetch identity info (fullName, DOB, etc.) from DynamoDB.
    2. Use get_case_files to get the list of uploaded document S3 references.
    3. Use extract_document_text for each document (once per s3_bucket/s3_key pair).
    4. Use compare_identity_documents with the case_details JSON and a JSON array of
       all Textract extraction results to produce the final comparison analysis.
    Return valid JSON with case_id, name, comparison_result, discrepancies, comparison_summary,
    and documents_summary.
  expected_output: >
    Valid JSON object with exactly these keys:
    - "case_id": the case ID (string)
    - "name": full name from identity.fullName (string)
    - "comparison_result": one of "MATCH", "PARTIAL_MATCH", "MISMATCH" (string)
    - "discrepancies": list of strings describing mismatches (array, empty if MATCH)
    - "comparison_summary": explanation of the comparison outcome (string)
    - "documents_summary": brief summary of each document processed (string)
  agent: document_processing_agent

screening_task:
  description: >
    Given caseId {caseId}:
    1. Use get_case_details to fetch the case from DynamoDB and extract identity.fullName and case_id.
    2. Use search_person with the person_name (and pass case_id for propagation) to find news, sanctions, PEP, and adverse media.
    3. Use produce_screening_analysis with the case details and search results to generate the screening analysis.
    Return valid JSON with name, analysis_result (screening ok | screening not ok | ambiguous), and analysis_summary.
  expected_output: >
    Valid JSON object with exactly these keys:
    - "case_id": the case ID from the case (string)
    - "name": the full name from identity.fullName (string)
    - "analysis_result": one of "OK", "NOK", "AMBIGUOUS" (string)
    - "analysis_summary": a short summary explaining the reasoning (string)
    - "search_results_summary": concise summary of key info from web search (string)
    Example: {"case_id": "01HR9B5J7Z6J7PD5B6PKQJ2MM4", "name": "Paul Vincent", "analysis_result": "screening ok", "analysis_summary": "No adverse findings.", "search_results_summary": "Search returned no adverse media."}
  agent: kyc_screening_agent
